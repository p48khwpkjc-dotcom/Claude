# Day-trading bot -- agreed baseline.
# Every risk number here is deliberately conservative. Widen them only after a
# walk-forward result you actually believe.

account:
  start_equity: 10000        # USD, notional for the backtest
  quote_currency: USDT

risk:
  risk_per_trade_pct: 0.5    # 50 USD on a 10k account
  max_daily_loss_pct: 3.0    # kill switch: no new entries for the rest of the UTC day
  max_leverage: 1.0          # no leverage until the strategy has proven itself
  max_concurrent_positions: 1
  max_trades_per_day: 5
  cooldown_after_losses: 3   # three losers in a row -> pause
  cooldown_bars: 12          # ...for one hour on 5m bars
  max_hold_hours: 4.0        # crypto has no close, so positions time out
  min_stop_distance_pct: 0.05
  max_stop_distance_pct: 5.0

execution:
  taker_fee_pct: 0.05        # per side
  slippage_bps: 3.0
  stop_slippage_bps: 5.0

data:
  symbols: [BTCUSDT, ETHUSDT, SOLUSDT]
  interval: 5m               # decision timeframe
  htf_interval: 1h           # trend filter
  history_days: 540
  cache_dir: data/cache
  source: cache              # "synthetic" runs with no network at all
  synthetic_bars: 40000

backtest:
  train_split: 0.6           # choose on the first 60%, verify on the unseen 40%
  warmup_bars: 250
  out_dir: out

strategies:
  vwap_reversion:
    band_mult: 2.0
    rsi_window: 14
    rsi_long_max: 32
    rsi_short_min: 68
    atr_window: 14
    stop_atr_mult: 1.2
    min_target_r: 1.0
    htf_ema: 50
    max_trend_slope: 0.02    # skip mean reversion inside a strong trend
  opening_range:
    range_minutes: 60
    atr_window: 14
    stop_atr_mult: 1.0
    target_r: 2.0
    min_volume_ratio: 1.3
    max_entry_hour: 20       # no fresh breakouts late in the UTC day
    trail_atr_mult: 2.0
  ema_momentum:
    fast: 12
    slow: 34
    atr_window: 14
    stop_atr_mult: 1.5
    target_r: 2.0
    min_volume_ratio: 1.2
    htf_ema: 50
    trail_atr_mult: 2.5
