name: Tech-Rotation

# Der Job laeuft werktags um 15:00 deutscher Zeit. Ob wirklich
# rebalanciert wird, entscheidet die Strategie selbst: `techrot rebalance`
# handelt nur, wenn seit dem letzten Lauf ein Kalendermonat vergangen ist.
# Ein ausgefallener Lauf holt den Termin am naechsten Tag nach.
#
# 15:00 deutscher Zeit liegt normalerweise eine halbe Stunde vor der
# US-Eroeffnung (13:30 UTC im Sommer, 14:30 UTC im Winter). Signale stammen
# damit vom Vortagesschluss, die Marktorders werden zur Eroeffnung
# ausgefuehrt. Ausnahme sind die zwei bis drei Wochen im Jahr, in denen EU
# und USA ihre Zeitumstellung nicht gleichzeitig machen -- dann laeuft der
# Job rund 30 Minuten NACH der Eroeffnung und die Orders fuellen untertags
# statt zum Open.
#
# Achtung: GitHub startet Cron-Workflows nur vom Default-Branch. Solange
# diese Datei auf einem Feature-Branch liegt, laeuft nur der manuelle Start.

on:
  schedule:
    # GitHub-Cron kennt nur UTC und keine Zeitumstellung. Die beiden
    # Termine zusammen decken 15:00 deutscher Zeit ganzjaehrig ab; der
    # Job "Zeitfenster" laesst dann jeweils nur den richtigen durch.
    - cron: "0 13 * * 1-5" # 15:00 Berlin waehrend der Sommerzeit (MESZ)
    - cron: "0 14 * * 1-5" # 15:00 Berlin waehrend der Winterzeit (MEZ)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Nur planen, keine Orders senden"
        type: boolean
        default: true
      force:
        description: "Auch ausserhalb des Monatstermins rebalancieren"
        type: boolean
        default: false
  push:
    paths:
      - "tech-rotation/**"
      - ".github/workflows/tech-rotation.yml"

defaults:
  run:
    working-directory: tech-rotation

jobs:
  zeitfenster:
    name: Zeitfenster
    runs-on: ubuntu-latest
    outputs:
      weiter: ${{ steps.pruefen.outputs.weiter }}
    steps:
      - name: Auf 15 Uhr deutscher Zeit pruefen
        id: pruefen
        run: |
          # Nur der Cron-Lauf braucht die Pruefung -- von den beiden
          # UTC-Terminen ist je nach Jahreszeit genau einer der richtige.
          # Ein manueller Start soll zu jeder Uhrzeit durchgehen.
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "weiter=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          STUNDE=$(TZ=Europe/Berlin date +%H)
          if [ "$STUNDE" = "15" ]; then
            echo "weiter=true" >> "$GITHUB_OUTPUT"
            echo "15:00 Uhr in Berlin -- der Lauf geht weiter."
          else
            echo "weiter=false" >> "$GITHUB_OUTPUT"
            echo "Es ist $STUNDE:00 Uhr in Berlin. Das ist der Zwillingstermin"
            echo "aus der anderen Jahreszeit -- uebersprungen."
          fi

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Abhaengigkeiten installieren
        run: pip install -e ".[dev]"
      - name: Testsuite
        run: python -m pytest -q

  rebalance:
    name: Rebalancing
    # Auf Push nur testen: gehandelt wird nach Zeitplan oder auf Zuruf.
    # Beim Zeitplan zusaetzlich nur zum richtigen der beiden UTC-Termine.
    if: github.event_name != 'push' && needs.zeitfenster.outputs.weiter == 'true'
    needs: [zeitfenster, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: tech-rotation-rebalance
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Abhaengigkeiten installieren
        run: pip install -e .

      - name: Startbereitschaft pruefen
        id: preflight
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        run: |
          set +e
          techrot preflight --refresh | tee -a "$GITHUB_STEP_SUMMARY"
          CODE=${PIPESTATUS[0]}
          # 0 = sauber, 1 = Hinweise (z.B. Benchmark unter der SMA -- ein
          # gueltiger Zustand), ab 2 fehlt etwas Wesentliches.
          if [ "$CODE" -ge 2 ]; then
            echo "Preflight blockiert den Lauf." >&2
            exit 1
          fi
          exit 0

      - name: Rebalancing
        id: run
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          # TECHROT_ALLOW_LIVE bleibt bewusst ungesetzt. Echter Handel
          # verlangt, dass diese Zeile hier bewusst aktiviert wird UND
          # execution.mode in config.yaml auf "live" steht.
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "schedule" ] \
             || [ "${{ inputs.dry_run }}" = "false" ]; then
            ARGS="--execute"
          fi
          if [ "${{ inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          techrot rebalance $ARGS --markdown report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Report sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rebalance-report-${{ github.run_id }}
          path: |
            tech-rotation/report.md
            tech-rotation/data/state.json
            tech-rotation/data/orders.jsonl
          if-no-files-found: ignore
          retention-days: 90

      - name: Zustand zurueckschreiben
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Erst stagen, dann vergleichen. "git diff" allein sieht nur
          # verfolgte Dateien -- beim allerersten Lauf sind state.json und
          # orders.jsonl aber neu, und der Zustand waere still verlorengegangen.
          git add data/
          if git diff --cached --quiet -- data/; then
            echo "Kein Zustandswechsel -- nichts zu committen."
            exit 0
          fi

          # An Handelstagen ohne Rebalancing aendert sich nur die
          # Equity-Kurve. Das ist beabsichtigt: die Drawdown-Bremse braucht
          # taegliche Punkte, genau wie im Backtest.
          if git diff --cached --quiet -- data/orders.jsonl; then
            NACHRICHT="Tech-Rotation: Depotbewertung $(date -u +%Y-%m-%d)"
          else
            NACHRICHT="Tech-Rotation: Rebalancing $(date -u +%Y-%m-%d)"
          fi
          git commit -m "$NACHRICHT"
          git push
