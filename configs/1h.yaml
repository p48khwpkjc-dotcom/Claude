# 1h-Entscheidungen, 4h-Trendfilter. Haltedauer 24 h = 24 Kerzen:
# damit laufen 27,5 % von 29,3 % erreichbaren Zielen durch (ZEITRAHMEN.md).
# Der Zeitrahmen mit der stabilsten Rohkante -- und der Gebuehr, die sie frisst.
# Day-trading bot -- agreed baseline.
# Every risk number here is deliberately conservative. Widen them only after a
# walk-forward result you actually believe.

account:
  start_equity: 10000        # USD, notional for the backtest
  quote_currency: USDT

risk:
  risk_per_trade_pct: 0.5    # 50 USD on a 10k account
  max_daily_loss_pct: 3.0    # kill switch: no new entries for the rest of the UTC day
  max_leverage: 1.0          # no leverage until the strategy has proven itself
  max_concurrent_positions: 1
  max_trades_per_day: 5
  cooldown_after_losses: 3   # three losers in a row -> pause
  cooldown_bars: 1           # ~1 Stunde auf 1h-Kerzen
  max_hold_hours: 24.0      # 24 Kerzen -- siehe ZEITRAHMEN.md
  min_stop_distance_pct: 0.05
  max_stop_distance_pct: 5.0

execution:
  taker_fee_pct: 0.05        # per side
  slippage_bps: 3.0
  stop_slippage_bps: 5.0

data:
  symbols: [BTCUSDT, ETHUSDT, SOLUSDT]
  interval: 1h               # decision timeframe
  htf_interval: 4h           # trend filter
  history_days: 900
  cache_dir: data/cache
  source: cache              # "synthetic" runs with no network at all
  synthetic_bars: 40000

backtest:
  train_split: 0.6           # choose on the first 60%, verify on the unseen 40%
  warmup_bars: 250
  out_dir: out/1h

strategies:
  vwap_reversion:
    band_mult: 1.8
    rsi_window: 14
    rsi_long_max: 38
    rsi_short_min: 62
    atr_window: 14
    stop_atr_mult: 1.2
    min_target_r: 1.0
    htf_ema: 50
    max_trend_slope: 0.05    # skip mean reversion inside a strong trend
  opening_range:
    range_minutes: 60
    atr_window: 14
    stop_atr_mult: 1.0
    target_r: 2.0
    min_volume_ratio: 1.3
    max_entry_hour: 20       # no fresh breakouts late in the UTC day
    trail_atr_mult: 2.0
  ema_momentum:
    fast: 12
    slow: 34
    atr_window: 14
    stop_atr_mult: 1.5
    target_r: 2.0
    min_volume_ratio: 1.0
    htf_ema: 50
    trail_atr_mult: 2.5
  donchian_breakout:
    channel: 48
    atr_window: 14
    stop_atr_mult: 2.0
    target_r: 2.5
    trail_atr_mult: 3.0
    min_volume_ratio: 1.0
  rsi_reversion:
    rsi_window: 14
    oversold: 30
    overbought: 70
    atr_window: 14
    stop_atr_mult: 2.0
    target_atr_mult: 2.0
    exit_rsi: 50
  squeeze_breakout:
    bb_window: 20
    bb_mult: 2.0
    squeeze_lookback: 96
    squeeze_percentile: 0.25
    atr_window: 14
    stop_atr_mult: 1.5
    target_r: 2.0
    trail_atr_mult: 2.5
    min_volume_ratio: 1.2
